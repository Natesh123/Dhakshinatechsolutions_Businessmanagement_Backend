[build]
  command = "npm run build"
  functions = "dist"
  publish = "dist"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["mysql2", "sequelize"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/index/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/index/:splat"
  status = 200
